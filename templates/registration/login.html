<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — CampusCare</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 1.6rem; color: #1a56db; }
    .logo p { font-size: 0.85rem; color: #718096; margin-top: 4px; }
    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #4a5568; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type="text"], input[type="password"] {
      width: 100%;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #2d3748;
      background: #f7fafc;
      margin-bottom: 18px;
    }
    input:focus { outline: none; border-color: #1a56db; background: #fff; }
    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #1a56db, #0e9f6e);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    .back-link { text-align: center; margin-top: 18px; }
    .back-link a { color: #1a56db; font-size: 0.88rem; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .notice { font-size: 0.78rem; color: #a0aec0; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🏫 CampusCare</h1>
      <p>Staff Login — authorised personnel only</p>
    </div>

    {% if form.errors %}
      <div class="error-msg">Invalid username or password. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" id="id_username" name="username" autofocus autocomplete="username" />

      <label for="id_password">Password</label>
      <input type="password" id="id_password" name="password" autocomplete="current-password" />

      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit">Log in</button>
    </form>

    <div class="back-link">
      <a href="{% url 'home' %}">← Back to student portal</a>
    </div>
    <div class="notice">This dashboard is for campus staff only. Student complaints are submitted via the main portal.</div>
  </div>
</body>
</html>
